services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: clinical-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=clinical_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./backups:/backups          # Mount for pg_dump snapshots
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinical_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinical-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.docker                 # Source secrets from file, not hardcoded
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/clinical_db
      - PORT=3001
      - NODE_ENV=production
      - DB_POOL_MAX=20
      - DB_POOL_MIN=5
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
    depends_on:
      db:
        condition: service_healthy
    command: npm start
    volumes:
      - ./logs:/app/logs            # Persist morgan access logs

volumes:
  timescale_data:
