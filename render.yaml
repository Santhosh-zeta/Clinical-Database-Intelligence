services:
  # 1. Private Database (TimescaleDB)
  # Uses the public TimescaleDB image directly, no Dockerfile needed.
  - type: pserv
    name: clinical-db
    env: docker
    disk:
      name: timescaledb-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 1
    envVars:
      - key: POSTGRES_DB
        value: clinical_db
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        value: "SuperSecretIntelliCareDB123!"

  # 2. Backend API
  - type: web
    name: clinical-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "*" # Allow the frontend to connect from anywhere
      # Note: Render does not easily support building connection strings from docker env vars.
      # We will set PGUSER, PGPASSWORD, PGHOST, PGDATABASE separately for pg-pool.
      - key: PGHOST
        value: clinical-db
      - key: PGDATABASE
        value: clinical_db
      - key: PGUSER
        value: postgres
      - key: PGPASSWORD
        fromService:
          type: pserv
          name: clinical-db
          envVarKey: POSTGRES_PASSWORD

  # 3. Frontend UI
  - type: web
    name: clinical-ui
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: clinical-api
          envVarKey: RENDER_EXTERNAL_URL

  # 4. Background Simulator
  - type: worker
    name: clinical-simulator
    env: node
    rootDir: simulator
    buildCommand: npm install
    startCommand: node simulate.js
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: clinical-api
          envVarKey: RENDER_EXTERNAL_URL
